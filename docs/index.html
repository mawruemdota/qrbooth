<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RND WXC Test</title><style>body{font:16px system-ui;background:#0a2029;color:white;margin:0;padding:24px;text-align:center}main{max-width:560px;margin:auto}video{width:100%;max-width:380px;aspect-ratio:9/16;object-fit:cover;background:#162d36;border:5px solid #09a6b6;border-radius:16px}button,input{font:inherit;padding:12px;margin:8px;border-radius:8px}button{background:#0aa9b6;color:white;border:0;cursor:pointer}button:disabled{opacity:.4}.notice{color:#f4ca82}iframe{display:none}label{display:block;margin:15px}</style></head><body><main><h1>RND WXC Test</h1><p></p><video id="video" playsinline autoplay muted></video><div id="status"></div><button id="start">Record (3-second countdown)</button><div id="review" hidden><label><input id="consent" type="checkbox"> I agree to submit this video for event testing.</label><button id="retake">Retake</button><button id="send" disabled>Submit Video</button></div><p class="notice">Testing only.</p></main><script>
const CONFIG={cloudName:"c32ewr2u",uploadPreset:"qrbooth"};
const v=document.getElementById('video'),status=document.getElementById('status'),start=document.getElementById('start'),review=document.getElementById('review'),send=document.getElementById('send'),consent=document.getElementById('consent');
let stream,blob,url;let device=localStorage.getItem('qrbooth-device');if(!device){device=crypto.randomUUID();localStorage.setItem('qrbooth-device',device)}
async function reset(){if(url)URL.revokeObjectURL(url);url=null;blob=null;consent.checked=false;send.disabled=true;review.hidden=true;v.controls=false;v.muted=true;v.srcObject=null;v.removeAttribute('src');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});v.srcObject=stream;await v.play();start.hidden=false;status.textContent='Ready to record'}catch(e){status.textContent='Camera error: '+e.message}}
start.onclick=async()=>{start.hidden=true;for(let i=3;i>0;i--){status.textContent='Starting in '+i;await new Promise(r=>setTimeout(r,1000))}let chunks=[];const mime=['video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime){status.textContent='Unsupported browser';return}const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:700000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{blob=new Blob(chunks,{type:mime.startsWith('video/mp4')?'video/mp4':'video/webm'});url=URL.createObjectURL(blob);stream.getTracks().forEach(t=>t.stop());v.srcObject=null;v.src=url;v.muted=false;v.controls=true;review.hidden=false;status.textContent='Review your recording'};recorder.start();status.textContent='Recording...';setTimeout(()=>{if(recorder.state==='recording')recorder.stop()},5000)};
document.getElementById('retake').onclick=reset;consent.onchange=()=>send.disabled=!consent.checked;
send.onclick=async()=>{if(!blob){status.textContent='No recording available';return}send.disabled=true;status.textContent='Uploading...';try{const data=new FormData();data.append('file',blob,'qrbooth-'+Date.now()+(blob.type==='video/mp4'?'.mp4':'.webm'));data.append('upload_preset',CONFIG.uploadPreset);data.append('tags','rnd-wxc-test');const response=await fetch('https://api.cloudinary.com/v1_1/'+encodeURIComponent(CONFIG.cloudName)+'/video/upload',{method:'POST',body:data});const result=await response.json();if(!response.ok||!result.secure_url)throw new Error(result.error?.message||'Upload failed');status.textContent='Submitted successfully';review.hidden=true;v.controls=false;start.hidden=true;}catch(e){status.textContent='Upload failed: '+e.message;send.disabled=false}};
reset();
</script></body></html>
