<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Video Booth Test</title><style>body{font:16px system-ui;background:#0a2029;color:white;margin:0;padding:24px;text-align:center}main{max-width:560px;margin:auto}video{width:100%;max-width:380px;aspect-ratio:9/16;object-fit:cover;background:#162d36;border:5px solid #09a6b6;border-radius:16px}button,input{font:inherit;padding:12px;margin:8px;border-radius:8px}button{background:#0aa9b6;color:white;border:0;cursor:pointer}button:disabled{opacity:.4}.notice{color:#f4ca82}iframe{display:none}label{display:block;margin:15px}</style></head><body><main><h1>QR Video Booth</h1><p>Five-second video recording test</p><video id="video" playsinline autoplay muted></video><div id="status"></div><button id="start">Record (3-second countdown)</button><div id="review" hidden><label><input id="consent" type="checkbox"> I agree to submit this video for event testing.</label><button id="retake">Retake</button><button id="send" disabled>Submit to Google Drive</button></div><p class="notice">Testing only. Keep recordings under 6 MB.</p><iframe name="uploadTarget" id="uploadTarget"></iframe><form id="uploadForm" target="uploadTarget" method="POST" hidden><input name="payload" id="payload"></form></main><script>
const CONFIG={scriptUrl:"REPLACE_WITH_APPS_SCRIPT_WEB_APP_URL",uploadKey:"REPLACE_WITH_UPLOAD_KEY"};
const v=document.getElementById('video'),status=document.getElementById('status'),start=document.getElementById('start'),review=document.getElementById('review'),send=document.getElementById('send'),consent=document.getElementById('consent');
let stream,blob,url;let device=localStorage.getItem('qrbooth-device');if(!device){device=crypto.randomUUID();localStorage.setItem('qrbooth-device',device)}
async function reset(){if(url)URL.revokeObjectURL(url);url=null;blob=null;consent.checked=false;send.disabled=true;review.hidden=true;v.controls=false;v.muted=true;v.srcObject=null;v.removeAttribute('src');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});v.srcObject=stream;await v.play();start.hidden=false;status.textContent='Ready to record'}catch(e){status.textContent='Camera error: '+e.message}}
start.onclick=async()=>{start.hidden=true;for(let i=3;i>0;i--){status.textContent='Starting in '+i;await new Promise(r=>setTimeout(r,1000))}let chunks=[];const mime=['video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime){status.textContent='Unsupported browser';return}const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:700000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{blob=new Blob(chunks,{type:mime.startsWith('video/mp4')?'video/mp4':'video/webm'});url=URL.createObjectURL(blob);stream.getTracks().forEach(t=>t.stop());v.srcObject=null;v.src=url;v.muted=false;v.controls=true;review.hidden=false;status.textContent='Review your recording'};recorder.start();status.textContent='Recording...';setTimeout(()=>{if(recorder.state==='recording')recorder.stop()},5000)};
document.getElementById('retake').onclick=reset;consent.onchange=()=>send.disabled=!consent.checked;
send.onclick=async()=>{if(CONFIG.scriptUrl.startsWith('REPLACE')||CONFIG.uploadKey.startsWith('REPLACE')){status.textContent='Apps Script connection not configured';return}if(blob.size>6*1024*1024){status.textContent='Video too large';return}send.disabled=true;status.textContent='Uploading...';let b64=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(blob)});document.getElementById('payload').value=JSON.stringify({key:CONFIG.uploadKey,device,mime:blob.type,video:b64});document.getElementById('uploadForm').action=CONFIG.scriptUrl;document.getElementById('uploadForm').submit()};
window.addEventListener('message',e=>{if(e.data?.source!=='qrbooth-upload')return;if(e.data.ok){status.textContent='Submitted successfully';review.hidden=true;v.controls=false;start.hidden=true}else{status.textContent=e.data.error||'Upload failed';send.disabled=false}});
reset();
</script></body></html>
