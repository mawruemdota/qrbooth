<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RND WXC Test</title><style>:root{--bg:#0a2029;--accent:#09a6b6;--fg:#fff}*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:22px;text-align:center}main{max-width:600px;margin:auto}h1{font-size:clamp(24px,5vw,36px);margin:12px 0}p{line-height:1.45}.frame{width:min(100%,380px);aspect-ratio:9/16;margin:18px auto;position:relative;overflow:hidden;background:#152e35;border:4px solid var(--accent);border-radius:16px}.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding:24px;color:white;text-shadow:0 2px 8px #000;font-weight:700;font-size:24px;overflow:hidden}.overlay img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.overlay span{position:relative;z-index:1;overflow-wrap:anywhere}.frame.reviewing .overlay{display:none}button{font:inherit;background:var(--accent);border:0;border-radius:9px;color:#fff;padding:13px 18px;margin:5px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.notice{font-size:13px;color:#bed0d5}#status{min-height:24px;margin:12px}label{display:block;margin:12px}a{color:var(--accent)}[hidden]{display:none!important}</style></head><body><main><h1 id="pageTitle">RND WXC Test</h1><p id="subtitle">Record a short video</p><div class="frame" id="frame"><video id="video" autoplay muted playsinline></video><div class="overlay" id="overlay"><img id="overlayImage" alt="" hidden><span id="overlayText"></span></div></div><div id="status" role="status"></div><button id="start">Record</button><div id="review" hidden><label><input id="consent" type="checkbox"> I agree to submit this video for event testing.</label><button id="retake">Retake</button><button id="send" disabled>Submit</button></div><p class="notice">Test version · Videos upload to Cloudinary · Output is always portrait 9:16</p></main><script>
const CONFIG={cloudName:'c32ewr2u',uploadPreset:'qrbooth'};
const KEY='rnd-wxc-test-admin-settings';
const defaults={open:true,duration:5,countdown:3,cooldown:5,title:'RND WXC Test',subtitle:'Record a short video',background:'#0a2029',accent:'#09a6b6',overlayText:'',overlayUrl:'',overlayPosition:'bottom'};
function settings(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {...defaults}}}
const $=id=>document.getElementById(id),v=$('video'),status=$('status'),start=$('start'),review=$('review'),send=$('send'),consent=$('consent'),frame=$('frame');
let stream=null,blob=null,objectUrl=null,recording=false;
function applyLayout(){const s=settings();document.documentElement.style.setProperty('--bg',s.background);document.documentElement.style.setProperty('--accent',s.accent);$('pageTitle').textContent=s.title;$('subtitle').textContent=s.subtitle;$('overlayText').textContent=s.overlayText||'';const img=$('overlayImage');const u=s.overlayUrl||'';if(u&&/^https:\/\//i.test(u)){img.src=u;img.hidden=false}else{img.hidden=true;img.removeAttribute('src')}const pos={top:'flex-start',center:'center',bottom:'flex-end'};$('overlay').style.alignItems=pos[s.overlayPosition]||'flex-end';start.textContent='Record ('+s.countdown+'s countdown)'}
function checkOpen(){const s=settings();if(!s.open){start.disabled=true;status.textContent='Recording is closed on this device';return false}start.disabled=false;return true}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function reset(){stopCamera();if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=null;blob=null;recording=false;consent.checked=false;send.disabled=true;review.hidden=true;frame.classList.remove('reviewing');v.pause();v.removeAttribute('src');v.srcObject=null;v.controls=false;v.muted=true;start.hidden=false;applyLayout();if(!checkOpen())return;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:true});v.srcObject=stream;await v.play();status.textContent='Ready to record'}catch(e){status.textContent='Camera or microphone unavailable: '+e.message;start.disabled=true}}
function portraitStream(source){const canvas=document.createElement('canvas');canvas.width=540;canvas.height=960;const ctx=canvas.getContext('2d');let active=true;function paint(){if(!active)return;if(source.readyState>=2&&source.videoWidth){const w=source.videoWidth,h=source.videoHeight,target=9/16;let sx=0,sy=0,sw=w,sh=h;if(w/h>target){sw=h*target;sx=(w-sw)/2}else{sh=w/target;sy=(h-sh)/2}ctx.drawImage(source,sx,sy,sw,sh,0,0,canvas.width,canvas.height)}requestAnimationFrame(paint)}paint();const output=canvas.captureStream(30);if(stream){stream.getAudioTracks().forEach(t=>output.addTrack(t))}return {output,stop:()=>{active=false;output.getVideoTracks().forEach(t=>t.stop())}}}
start.onclick=async()=>{if(recording||!stream||!checkOpen())return;const s=settings();recording=true;start.hidden=true;for(let i=Math.max(0,Math.min(10,Number(s.countdown)||0));i>0;i--){status.textContent='Starting in '+i;await new Promise(r=>setTimeout(r,1000));if(!stream){recording=false;return}}const mime=['video/mp4','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!mime){status.textContent='Recording format unsupported';recording=false;start.hidden=false;return}const composed=portraitStream(v),chunks=[];let recorder;try{recorder=new MediaRecorder(composed.output,{mimeType:mime,videoBitsPerSecond:1300000})}catch(e){composed.stop();status.textContent='Recorder error: '+e.message;recording=false;start.hidden=false;return}recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onerror=()=>{status.textContent='Recording failed'};recorder.onstop=()=>{composed.stop();blob=new Blob(chunks,{type:recorder.mimeType||mime});objectUrl=URL.createObjectURL(blob);stopCamera();v.srcObject=null;v.src=objectUrl;v.muted=false;v.controls=true;frame.classList.add('reviewing');review.hidden=false;recording=false;status.textContent='Review your portrait recording'};recorder.start();status.textContent='Recording in portrait...';setTimeout(()=>{if(recorder.state==='recording')recorder.stop()},Math.max(1,Math.min(60,Number(s.duration)||5))*1000)};
$('retake').onclick=reset;consent.onchange=()=>send.disabled=!consent.checked;
send.onclick=async()=>{if(!blob||!consent.checked)return;const s=settings();if(!s.open){status.textContent='Submissions are closed on this device';return}const last=Number(localStorage.getItem('rnd-wxc-last-submit')||0);if(Date.now()-last<Math.max(0,Number(s.cooldown)||0)*60000){status.textContent='Please wait before submitting again';return}send.disabled=true;status.textContent='Uploading to Cloudinary...';try{const data=new FormData();const ext=blob.type.includes('mp4')?'mp4':'webm';data.append('file',blob,'qrbooth-'+Date.now()+'.'+ext);data.append('upload_preset',CONFIG.uploadPreset);data.append('tags','rnd-wxc-test');const res=await fetch('https://api.cloudinary.com/v1_1/'+CONFIG.cloudName+'/video/upload',{method:'POST',body:data});const result=await res.json();if(!res.ok||!result.secure_url)throw Error(result.error?.message||'Upload failed');localStorage.setItem('rnd-wxc-last-submit',String(Date.now()));status.textContent='Submitted successfully';review.hidden=true;v.controls=false;start.hidden=true}catch(e){status.textContent='Upload failed: '+e.message;send.disabled=false}};
window.addEventListener('storage',e=>{if(e.key===KEY){applyLayout();if(!recording)checkOpen()}});reset();
</script></body></html>
